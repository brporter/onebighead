services:
  sqlserver:
    build:
      context: ./build/sqlserver
      dockerfile: Dockerfile
    image: onebighead-sqlserver:latest
    container_name: onebighead-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevPassword123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "(cat < /dev/null > /dev/tcp/localhost/1433) 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: onebighead-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./build/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: onebighead-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./build/otel/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: onebighead-prometheus
    volumes:
      - ./build/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: onebighead-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./build/otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - prometheus

volumes:
  tempo-data:
