services:
  postgres:
    image: postgres:17
    container_name: onebighead-postgres
    environment:
      - POSTGRES_PASSWORD=DevPassword123!
      - POSTGRES_DB=onebighead
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onebighead"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
