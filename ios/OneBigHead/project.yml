name: OneBigHead
options:
  bundleIdPrefix: com.onebighead
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  microsoft-authentication-library-for-objc:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: "1.3.0"

targets:
  OneBigHead:
    type: application
    platform: iOS
    sources:
      - path: OneBigHead
    info:
      path: OneBigHead/Info.plist
      properties:
        CFBundleDisplayName: OneBigHead
        UILaunchScreen:
          UILaunchScreen_Generation: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.onebighead.app.msauth
            CFBundleURLSchemes:
              - msauth.com.onebighead.app
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onebighead.app
    dependencies:
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - package: microsoft-authentication-library-for-objc
        product: MSAL

  OneBigHeadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneBigHeadTests
    dependencies:
      - target: OneBigHead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneBigHead.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OneBigHead"
        BUNDLE_LOADER: "$(TEST_HOST)"
