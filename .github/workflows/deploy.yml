# Deploy to production VM (shell.betaporter.dev)
# Triggered when a PR is merged to main
#
# Pipeline shape:
#   1. Run tests
#   2. Build frontend + backend into a Docker image
#   3. Push it to ghcr.io
#   4. Watchtower on the VM notices the new image within ~5 minutes and
#      recreates the app container (see deploy/vm/docker-compose.yml)
#
# Database changes are NOT applied by this pipeline. The image contains a
# self-contained EF migration bundle (/app/efbundle) and the seeder
# (/app/dbseed) — run them manually when a release includes schema or seed
# changes (see docs/DEPLOYMENT.md).
#
# No repository secrets required; ghcr.io push uses the automatic
# GITHUB_TOKEN. The ghcr.io package must be PUBLIC (the VM pulls anonymously).

name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/onebighead

permissions:
  contents: read
  packages: write

jobs:
  # Only run if PR was merged (not just closed) or manually triggered
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        run: |
          # For manual dispatch, always deploy. For PR events, check if merged.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=${{ github.event.pull_request.merged }}" >> $GITHUB_OUTPUT
          fi

  # Run tests before deployment
  test:
    needs: check-merge
    if: needs.check-merge.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend/tests/backend.tests/backend.tests.csproj

      - name: Run all backend tests
        run: dotnet test backend/tests/backend.tests/backend.tests.csproj --no-restore --verbosity normal

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # Build the image and publish it; watchtower on the VM deploys it
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install EF Core tools
        run: dotnet tool restore

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          dotnet publish backend/src/backend/backend.csproj -c Release -o publish
          mkdir -p publish/wwwroot/collections
          cp -r frontend/dist/* publish/wwwroot/collections/

      - name: Build database tools
        run: |
          dotnet publish backend/tools/dbreset/dbreset.csproj -c Release -r linux-x64 -o publish
          dotnet publish backend/tools/dbseed/dbseed.csproj -c Release -r linux-x64 -o publish
          # Copy seed data files from central location
          cp -r backend/seeds publish/seeds

      # Bundled into the image for manual execution on the VM
      - name: Generate migration bundle
        run: |
          cd backend/src/backend
          dotnet ef migrations bundle --self-contained -r linux-x64 -o ../../../publish/efbundle --force

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${IMAGE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_NAME}:latest"

          docker build --platform linux/amd64 -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f deployment/Dockerfile .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Output deployment summary
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed via | watchtower on shell.betaporter.dev (~5 min) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
