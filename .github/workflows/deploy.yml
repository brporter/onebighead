# Deploy to Azure Container Apps
# Triggered when a PR is merged to main
#
# Prerequisites (one-time setup before first pipeline run):
#   1. Azure infrastructure must be provisioned using deploy.sh or deploy.ps1
#   2. GitHub repository secrets must be configured (see DEPLOYMENT.md)
#   3. Azure service principal must have OIDC federated credentials configured
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID          - Service principal client ID
#   AZURE_TENANT_ID          - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
#   AZURE_APP_NAME           - Base name for Azure resources (e.g., "onebighead")
#   JWT_SIGNING_KEY          - JWT signing key (min 32 characters)
#
# Optional GitHub Secrets:
#   APP_DOMAIN               - Custom domain (e.g., "onebighead.com"). If not set, uses Container App URL.
#   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   APPLE_CLIENT_ID, APPLE_CLIENT_SECRET
#   EMAIL_CONNECTION_STRING  - Azure Communication Services connection string (for support emails)
#   EMAIL_SENDER_ADDRESS     - Verified sender address (e.g., "noreply@your-domain.com")
#
# Infrastructure is provisioned via Bicep templates (infra/main.bicep) using deploy.sh/deploy.ps1.
# This workflow assumes all infrastructure (including the Container App) already exists.

name: Deploy to Azure

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

# OIDC permissions for Azure login
permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  # Only run if PR was merged (not just closed) or manually triggered
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        run: |
          # For manual dispatch, always deploy. For PR events, check if merged.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=${{ github.event.pull_request.merged }}" >> $GITHUB_OUTPUT
          fi

  # Run tests before deployment
  test:
    needs: check-merge
    if: needs.check-merge.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend/backend.csproj

      - name: Run unit tests
        run: dotnet test backend.tests/backend.tests.csproj --filter "Category=Unit" --no-restore --verbosity normal

      - name: Run integration tests
        run: dotnet test backend.tests/backend.tests.csproj --filter "Category=Integration" --no-restore --verbosity normal

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # Build and deploy to Azure
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Derive resource names from APP_NAME
      - name: Set environment variables
        run: |
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          echo "RESOURCE_GROUP=${APP_NAME}-rg" >> $GITHUB_ENV
          echo "ACR_NAME=${APP_NAME}acr" >> $GITHUB_ENV
          echo "SQL_DB_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "CONTAINER_APP_NAME=${APP_NAME}-app" >> $GITHUB_ENV
          echo "IDENTITY_NAME=${APP_NAME}-identity" >> $GITHUB_ENV

      # Look up existing SQL server name from resource group
      - name: Get SQL Server name
        run: |
          SQL_SERVER_NAME=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$SQL_SERVER_NAME" ]; then
            echo "::error::No SQL server found in resource group $RESOURCE_GROUP. Run deploy.sh first to provision infrastructure."
            exit 1
          fi
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" >> $GITHUB_ENV

      # Build the application
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          dotnet publish backend/backend.csproj -c Release -o publish
          mkdir -p publish/wwwroot/collections
          cp -r frontend/dist/* publish/wwwroot/collections/

      - name: Build database tools
        run: |
          dotnet publish tools/dbreset/dbreset.csproj -c Release -r linux-x64 -o publish
          dotnet publish tools/dbseed/dbseed.csproj -c Release -r linux-x64 -o publish
          # Copy seed data files from central location
          cp -r seeds publish/seeds

      # Generate migration assets
      - name: Generate migration script and bundle
        run: |
          cd backend
          # SQL script for pipeline execution
          dotnet ef migrations script --idempotent -o ../publish/migrate.sql
          # Self-contained bundle for manual execution from container
          dotnet ef migrations bundle --self-contained -r linux-x64 -o ../publish/efbundle --force

      # Build and push Docker image
      - name: Get ACR details
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${{ secrets.AZURE_APP_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${{ secrets.AZURE_APP_NAME }}:latest"

          docker build --platform linux/amd64 -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Deploy Container App (secrets + image + env vars in one step)
      - name: Deploy Container App
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # --- Set secrets ---
          SECRETS=("jwt-signing-key=${{ secrets.JWT_SIGNING_KEY }}")

          if [ -n "${{ secrets.MICROSOFT_CLIENT_SECRET }}" ]; then
            SECRETS+=("microsoft-client-secret=${{ secrets.MICROSOFT_CLIENT_SECRET }}")
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            SECRETS+=("google-client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}")
          fi
          if [ -n "${{ secrets.APPLE_CLIENT_SECRET }}" ]; then
            SECRETS+=("apple-client-secret=${{ secrets.APPLE_CLIENT_SECRET }}")
          fi
          if [ -n "${{ secrets.EMAIL_CONNECTION_STRING }}" ]; then
            SECRETS+=("email-connection-string=${{ secrets.EMAIL_CONNECTION_STRING }}")
          fi

          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "${SECRETS[@]}" \
            --output none

          # --- Determine OAuth base URL ---
          if [ -n "$APP_DOMAIN" ]; then
            APP_URL="$APP_DOMAIN"
            echo "Using custom domain for OAuth: https://$APP_URL"
          else
            APP_URL=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv)
            echo "Using Container App URL for OAuth: https://$APP_URL"
          fi

          # --- Build env vars (only secrets + OAuth config; connection string and App Insights set by Bicep) ---
          ENV_VARS=(
            "Authentication__Jwt__SigningKey=secretref:jwt-signing-key"
            "Authentication__OAuth__BaseUrl=https://${APP_URL}"
          )

          if [ -n "${{ secrets.MICROSOFT_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Microsoft__ClientId=${{ secrets.MICROSOFT_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Microsoft__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Microsoft__ClientSecret=secretref:microsoft-client-secret")
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Google__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Google__ClientSecret=secretref:google-client-secret")
          fi
          if [ -n "${{ secrets.APPLE_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Apple__ClientId=${{ secrets.APPLE_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Apple__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Apple__ClientSecret=secretref:apple-client-secret")
          fi

          # Email service configuration
          if [ -n "${{ secrets.EMAIL_CONNECTION_STRING }}" ]; then
            ENV_VARS+=("Email__ConnectionString=secretref:email-connection-string")
            ENV_VARS+=("Email__AppBaseUrl=https://${APP_URL}")
          fi
          if [ -n "${{ secrets.EMAIL_SENDER_ADDRESS }}" ]; then
            ENV_VARS+=("Email__SenderAddress=${{ secrets.EMAIL_SENDER_ADDRESS }}")
          fi

          # --- Update container app with new image ---
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG" \
            --set-env-vars "${ENV_VARS[@]}" \
            --output none

      # Database setup
      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y sqlcmd

      - name: Add runner IP to SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Wait for SQL Azure to be ready
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Waiting for SQL Azure serverless database to be ready..."
          echo "This may take up to 60 seconds if the database is paused."

          for i in {1..12}; do
            echo "  Connection attempt $i/12..."
            if sqlcmd -S "$SQL_SERVER_FQDN" \
                -d "$SQL_DB_NAME" \
                --authentication-method=ActiveDirectoryDefault \
                -Q "SELECT 1" \
                -b \
                2>&1; then
              echo "SQL Azure is ready!"
              exit 0
            fi
            echo "  Database not ready yet, waiting 10 seconds..."
            sleep 10
          done

          echo "::error::SQL Azure database did not become ready within 2 minutes"
          exit 1

      - name: Create SQL managed identity user
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Ensuring managed identity user exists in database..."
          sqlcmd -S "$SQL_SERVER_FQDN" \
            -d "$SQL_DB_NAME" \
            --authentication-method=ActiveDirectoryDefault \
            -b \
            -Q "
          IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '${IDENTITY_NAME}')
          BEGIN
              CREATE USER [${IDENTITY_NAME}] FROM EXTERNAL PROVIDER;
          END
          ALTER ROLE db_datareader ADD MEMBER [${IDENTITY_NAME}];
          ALTER ROLE db_datawriter ADD MEMBER [${IDENTITY_NAME}];
          ALTER ROLE db_ddladmin ADD MEMBER [${IDENTITY_NAME}];
          PRINT 'User ${IDENTITY_NAME} configured successfully';
          "

      - name: Run database migrations
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Applying database migrations..."
          # -b flag makes sqlcmd exit with non-zero code on SQL errors
          sqlcmd -S "$SQL_SERVER_FQDN" \
            -d "$SQL_DB_NAME" \
            --authentication-method=ActiveDirectoryDefault \
            -b \
            -i publish/migrate.sql
          echo "Migrations applied successfully."

      - name: Seed database
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Seeding database with reference data..."
          # Build connection string for dbseed (uses Azure CLI auth via DefaultAzureCredential)
          export ConnectionStrings__DefaultConnection="Server=tcp:${SQL_SERVER_FQDN},1433;Database=${SQL_DB_NAME};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;"
          # Run seeder with --force (no prompt) - operates idempotently
          ./publish/dbseed publish/seeds --force
          echo "Database seeding complete."

      - name: Remove runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --output none || true

      # Verify deployment
      - name: Verify deployment
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          if [ -n "$APP_DOMAIN" ]; then
            HEALTH_URL="https://${APP_DOMAIN}/health"
          else
            APP_URL=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv)
            HEALTH_URL="https://${APP_URL}/health"
          fi

          echo "Health check URL: $HEALTH_URL"

          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "  Waiting for health check ($i/6)... Status: $HTTP_STATUS"
            sleep 5
          done

          echo "::warning::Health check did not return 200 within 30 seconds. The app may still be starting up."

      - name: Output deployment summary
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application URL | https://${APP_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | $CONTAINER_APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
