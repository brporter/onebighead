# Deploy to Azure Container Apps
# Triggered when a PR is merged to main
#
# Prerequisites (one-time setup before first pipeline run):
#   1. Azure infrastructure must be provisioned using deploy.sh (without --skip-infra)
#   2. GitHub repository secrets must be configured (see DEPLOYMENT.md)
#   3. Azure service principal must have appropriate permissions
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS        - Service principal credentials JSON
#   AZURE_APP_NAME           - Base name for Azure resources (e.g., "onebighead")
#   AZURE_LOCATION           - Azure region (e.g., "eastus")
#   JWT_SIGNING_KEY          - JWT signing key (min 32 characters)
#
# Optional GitHub Secrets:
#   APP_DOMAIN               - Custom domain (e.g., "onebighead.com"). If not set, uses Container App URL.
#   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   APPLE_CLIENT_ID, APPLE_CLIENT_SECRET

name: Deploy to Azure

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  # Only run if PR was merged (not just closed) or manually triggered
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        run: |
          # For manual dispatch, always deploy. For PR events, check if merged.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=${{ github.event.pull_request.merged }}" >> $GITHUB_OUTPUT
          fi

  # Run tests before deployment
  test:
    needs: check-merge
    if: needs.check-merge.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend/backend.csproj

      - name: Run unit tests
        run: dotnet test backend.tests/backend.tests.csproj --filter "Category=Unit" --no-restore --verbosity normal

      - name: Run integration tests
        run: dotnet test backend.tests/backend.tests.csproj --filter "Category=Integration" --no-restore --verbosity normal

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # Build and deploy to Azure
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Derive resource names from APP_NAME
      - name: Set environment variables
        run: |
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          echo "RESOURCE_GROUP=${APP_NAME}-rg" >> $GITHUB_ENV
          echo "ACR_NAME=${APP_NAME}acr" >> $GITHUB_ENV
          echo "SQL_DB_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "CONTAINER_ENV_NAME=${APP_NAME}-env" >> $GITHUB_ENV
          echo "CONTAINER_APP_NAME=${APP_NAME}-app" >> $GITHUB_ENV
          echo "IDENTITY_NAME=${APP_NAME}-identity" >> $GITHUB_ENV

      # Look up existing SQL server name from resource group
      - name: Get SQL Server name
        run: |
          SQL_SERVER_NAME=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$SQL_SERVER_NAME" ]; then
            echo "::error::No SQL server found in resource group $RESOURCE_GROUP. Run deploy.sh first to provision infrastructure."
            exit 1
          fi
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" >> $GITHUB_ENV

      # Build the application
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          dotnet publish backend/backend.csproj -c Release -o publish
          mkdir -p publish/wwwroot/collections
          cp -r frontend/dist/* publish/wwwroot/collections/

      - name: Build database tools
        run: |
          dotnet publish tools/dbreset/dbreset.csproj -c Release -o publish
          dotnet publish tools/dbseed/dbseed.csproj -c Release -o publish
          # Copy seed data files
          cp -r tools/dbseed/seeds publish/seeds

      # Generate migration assets
      - name: Generate migration script and bundle
        run: |
          cd backend
          # SQL script for pipeline execution
          dotnet ef migrations script --idempotent -o ../publish/migrate.sql
          # Self-contained bundle for manual execution from container
          dotnet ef migrations bundle --self-contained -r linux-x64 -o ../publish/efbundle --force

      # Build and push Docker image
      - name: Get ACR details
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${{ secrets.AZURE_APP_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${{ secrets.AZURE_APP_NAME }}:latest"
          
          docker build --platform linux/amd64 -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Get managed identity details
      - name: Get managed identity details
        run: |
          IDENTITY_CLIENT_ID=$(az identity show --name "$IDENTITY_NAME" --resource-group "$RESOURCE_GROUP" --query clientId -o tsv)
          IDENTITY_ID=$(az identity show --name "$IDENTITY_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          echo "IDENTITY_CLIENT_ID=$IDENTITY_CLIENT_ID" >> $GITHUB_ENV
          echo "IDENTITY_ID=$IDENTITY_ID" >> $GITHUB_ENV

      # Build connection string
      - name: Build connection string
        run: |
          SQL_CONNECTION_STRING="Server=tcp:${SQL_SERVER_NAME}.database.windows.net,1433;Database=${SQL_DB_NAME};Authentication=Active Directory Managed Identity;User Id=${IDENTITY_CLIENT_ID};Encrypt=True;TrustServerCertificate=False;"
          echo "SQL_CONNECTION_STRING=$SQL_CONNECTION_STRING" >> $GITHUB_ENV

      # Update Container App (this will automatically create a new revision and deactivate old ones)
      - name: Update Container App secrets
        run: |
          # Build secrets array
          SECRETS=("jwt-signing-key=${{ secrets.JWT_SIGNING_KEY }}")
          
          if [ -n "${{ secrets.MICROSOFT_CLIENT_SECRET }}" ]; then
            SECRETS+=("microsoft-client-secret=${{ secrets.MICROSOFT_CLIENT_SECRET }}")
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            SECRETS+=("google-client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}")
          fi
          if [ -n "${{ secrets.APPLE_CLIENT_SECRET }}" ]; then
            SECRETS+=("apple-client-secret=${{ secrets.APPLE_CLIENT_SECRET }}")
          fi
          
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "${SECRETS[@]}" \
            --output none

      - name: Update Container App
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # Use custom domain if provided, otherwise use Container App URL
          echo "=============================================="
          echo "Determining OAuth Base URL..."
          echo "=============================================="
          if [ -n "$APP_DOMAIN" ]; then
            APP_URL="$APP_DOMAIN"
            echo "✓ APP_DOMAIN secret is SET"
            echo "✓ Using CUSTOM DOMAIN for OAuth: https://$APP_URL"
          else
            echo "✗ APP_DOMAIN secret is NOT set"
            APP_URL=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv)
            echo "✓ Using AUTO-DETECTED Container App URL: https://$APP_URL"
          fi
          echo "=============================================="
          
          # Build environment variables array
          ENV_VARS=(
            "ASPNETCORE_ENVIRONMENT=Production"
            "ConnectionStrings__DefaultConnection=$SQL_CONNECTION_STRING"
            "Authentication__Jwt__SigningKey=secretref:jwt-signing-key"
            "Authentication__OAuth__BaseUrl=https://${APP_URL}"
          )
          
          if [ -n "${{ secrets.MICROSOFT_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Microsoft__ClientId=${{ secrets.MICROSOFT_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Microsoft__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Microsoft__ClientSecret=secretref:microsoft-client-secret")
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Google__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Google__ClientSecret=secretref:google-client-secret")
          fi
          if [ -n "${{ secrets.APPLE_CLIENT_ID }}" ]; then
            ENV_VARS+=("Authentication__Providers__Apple__ClientId=${{ secrets.APPLE_CLIENT_ID }}")
            ENV_VARS+=("Authentication__Providers__Apple__Enabled=true")
            ENV_VARS+=("Authentication__Providers__Apple__ClientSecret=secretref:apple-client-secret")
          fi
          
          # Update container app with new image (creates new revision, deactivates old)
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG" \
            --set-env-vars "${ENV_VARS[@]}" \
            --output none

      # Run database migrations
      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y sqlcmd

      - name: Add runner IP to SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Wait for SQL Azure to be ready
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Waiting for SQL Azure serverless database to be ready..."
          echo "This may take up to 60 seconds if the database is paused."
          
          for i in {1..12}; do
            echo "  Connection attempt $i/12..."
            if sqlcmd -S "$SQL_SERVER_FQDN" \
                -d "$SQL_DB_NAME" \
                --authentication-method=ActiveDirectoryServicePrincipal \
                -U "${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}" \
                -P "${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}" \
                -Q "SELECT 1" \
                -b \
                2>&1; then
              echo "SQL Azure is ready!"
              exit 0
            fi
            echo "  Database not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          echo "::error::SQL Azure database did not become ready within 2 minutes"
          exit 1

      - name: Run database migrations
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Applying database migrations..."
          # -b flag makes sqlcmd exit with non-zero code on SQL errors
          sqlcmd -S "$SQL_SERVER_FQDN" \
            -d "$SQL_DB_NAME" \
            --authentication-method=ActiveDirectoryServicePrincipal \
            -U "${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}" \
            -P "${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}" \
            -b \
            -i publish/migrate.sql
          echo "Migrations applied successfully."

      - name: Remove runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --output none || true

      # Verify deployment
      - name: Verify deployment
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # Use custom domain for health check if configured
          echo "=============================================="
          echo "Verifying deployment..."
          echo "=============================================="
          if [ -n "$APP_DOMAIN" ]; then
            HEALTH_URL="https://${APP_DOMAIN}/health"
            echo "✓ Using CUSTOM DOMAIN for health check"
          else
            APP_URL=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv)
            HEALTH_URL="https://${APP_URL}/health"
            echo "✓ Using AUTO-DETECTED URL for health check"
          fi
          
          echo "Health check URL: $HEALTH_URL"
          echo "=============================================="
          
          # Brief health check - new revisions take a moment to become active
          echo "Verifying application health..."
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "  Waiting for health check ($i/6)... Status: $HTTP_STATUS"
            sleep 5
          done
          
          echo "::warning::Health check did not return 200 within 30 seconds. The app may still be starting up."

      - name: Output deployment summary
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application URL | https://${APP_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | $CONTAINER_APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
