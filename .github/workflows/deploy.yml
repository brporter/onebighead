# Deploy to production VM (shell.betaporter.dev)
# Triggered when a PR is merged to main
#
# Pipeline shape:
#   1. Run tests
#   2. Build frontend + backend, generate EF migration script
#   3. Apply migrations and seed data against Azure SQL (database stays in Azure)
#   4. Build the Docker image and push it to ghcr.io
#   5. Watchtower on the VM notices the new image within ~5 minutes and
#      recreates the app container (see deploy/vm/docker-compose.yml)
#
# Prerequisites (one-time setup before first pipeline run):
#   1. Azure SQL database provisioned (deployment/deploy.sh) and reachable
#   2. GitHub repository secrets configured (see docs/DEPLOYMENT.md)
#   3. The VM stack deployed at /opt/onebighead with a populated .env
#   4. The ghcr.io package must be PUBLIC (the VM pulls anonymously)
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID          - Service principal client ID (OIDC, for SQL access)
#   AZURE_TENANT_ID          - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
#   AZURE_APP_NAME           - Base name for Azure resources (e.g., "onebighead")
#
# Optional GitHub Secrets:
#   APP_DOMAIN               - Public hostname (defaults to onebighead.com)
#   SQL_APP_PRINCIPAL_NAME   - Entra principal the VM app connects as (the VM's
#                              system-assigned managed identity name, e.g.
#                              "shell"); when set, a database user with
#                              read/write/ddl roles is ensured on every deploy

name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/onebighead

# OIDC permissions for Azure login; packages for ghcr.io push
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # Only run if PR was merged (not just closed) or manually triggered
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        run: |
          # For manual dispatch, always deploy. For PR events, check if merged.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=${{ github.event.pull_request.merged }}" >> $GITHUB_OUTPUT
          fi

  # Run tests before deployment
  test:
    needs: check-merge
    if: needs.check-merge.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend/tests/backend.tests/backend.tests.csproj

      - name: Run all backend tests
        run: dotnet test backend/tests/backend.tests/backend.tests.csproj --no-restore --verbosity normal

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # Build, migrate the database, and publish the image
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install EF Core tools
        run: dotnet tool restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Derive resource names from APP_NAME
      - name: Set environment variables
        run: |
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          echo "RESOURCE_GROUP=${APP_NAME}-rg" >> $GITHUB_ENV
          echo "SQL_DB_NAME=${APP_NAME}" >> $GITHUB_ENV

      # Look up existing SQL server name from resource group
      - name: Get SQL Server name
        run: |
          SQL_SERVER_NAME=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$SQL_SERVER_NAME" ]; then
            echo "::error::No SQL server found in resource group $RESOURCE_GROUP. Run deploy.sh first to provision infrastructure."
            exit 1
          fi
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" >> $GITHUB_ENV

      # Build the application
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          dotnet publish backend/src/backend/backend.csproj -c Release -o publish
          mkdir -p publish/wwwroot/collections
          cp -r frontend/dist/* publish/wwwroot/collections/

      - name: Build database tools
        run: |
          dotnet publish backend/tools/dbreset/dbreset.csproj -c Release -r linux-x64 -o publish
          dotnet publish backend/tools/dbseed/dbseed.csproj -c Release -r linux-x64 -o publish
          # Copy seed data files from central location
          cp -r backend/seeds publish/seeds

      # Generate migration assets
      - name: Generate migration script and bundle
        run: |
          cd backend/src/backend
          # SQL script for pipeline execution
          dotnet ef migrations script --idempotent -o ../../../publish/migrate.sql
          # Self-contained bundle for manual execution from container
          dotnet ef migrations bundle --self-contained -r linux-x64 -o ../../../publish/efbundle --force

      # Database setup (the database stays in Azure SQL)
      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y sqlcmd

      - name: Add runner IP to SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Wait for SQL Azure to be ready
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Waiting for SQL Azure serverless database to be ready..."
          echo "This may take up to 60 seconds if the database is paused."

          for i in {1..12}; do
            echo "  Connection attempt $i/12..."
            if sqlcmd -S "$SQL_SERVER_FQDN" \
                -d "$SQL_DB_NAME" \
                --authentication-method=ActiveDirectoryDefault \
                -Q "SELECT 1" \
                -b \
                2>&1; then
              echo "SQL Azure is ready!"
              exit 0
            fi
            echo "  Database not ready yet, waiting 10 seconds..."
            sleep 10
          done

          echo "::error::SQL Azure database did not become ready within 2 minutes"
          exit 1

      # Ensure the principal the VM app connects as has a database user
      - name: Create SQL user for app principal
        if: ${{ secrets.SQL_APP_PRINCIPAL_NAME != '' }}
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          PRINCIPAL="${{ secrets.SQL_APP_PRINCIPAL_NAME }}"
          echo "Ensuring database user exists for ${PRINCIPAL}..."
          sqlcmd -S "$SQL_SERVER_FQDN" \
            -d "$SQL_DB_NAME" \
            --authentication-method=ActiveDirectoryDefault \
            -b \
            -Q "
          IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '${PRINCIPAL}')
          BEGIN
              CREATE USER [${PRINCIPAL}] FROM EXTERNAL PROVIDER;
          END
          ALTER ROLE db_datareader ADD MEMBER [${PRINCIPAL}];
          ALTER ROLE db_datawriter ADD MEMBER [${PRINCIPAL}];
          ALTER ROLE db_ddladmin ADD MEMBER [${PRINCIPAL}];
          PRINT 'User ${PRINCIPAL} configured successfully';
          "

      - name: Run database migrations
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Applying database migrations..."
          # -b flag makes sqlcmd exit with non-zero code on SQL errors
          sqlcmd -S "$SQL_SERVER_FQDN" \
            -d "$SQL_DB_NAME" \
            --authentication-method=ActiveDirectoryDefault \
            -b \
            -i publish/migrate.sql
          echo "Migrations applied successfully."

      - name: Seed database
        run: |
          SQL_SERVER_FQDN="${SQL_SERVER_NAME}.database.windows.net"
          echo "Seeding database with reference data..."
          # Build connection string for dbseed (uses Azure CLI auth via DefaultAzureCredential)
          export ConnectionStrings__DefaultConnection="Server=tcp:${SQL_SERVER_FQDN},1433;Database=${SQL_DB_NAME};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;"
          # Run seeder with --force (no prompt) - operates idempotently
          ./publish/dbseed publish/seeds --force
          echo "Database seeding complete."

      - name: Remove runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "GitHubRunner-${{ github.run_id }}" \
            --output none || true

      # Publish the image; watchtower on the VM deploys it
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${IMAGE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_NAME}:latest"

          docker build --platform linux/amd64 -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f deployment/Dockerfile .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Watchtower polls every 5 minutes; allow up to 10 for the swap
      - name: Verify deployment
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          HEALTH_URL="https://${APP_DOMAIN:-onebighead.com}/health"
          echo "Health check URL: $HEALTH_URL"
          echo "Waiting for watchtower to deploy the new image (polls every 5 minutes)..."

          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "  Waiting for health check ($i/40)... Status: $HTTP_STATUS"
            sleep 15
          done

          echo "::warning::Health check did not return 200 within 10 minutes. Check watchtower logs on the VM."

      - name: Output deployment summary
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application URL | https://${APP_DOMAIN:-onebighead.com} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed via | watchtower on shell.betaporter.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
